name: Build & Deploy Portfolio to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to foka.dogspa-cm.com
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'vite-ts/package-lock.json'

      - name: 📦 Install dependencies
        working-directory: ./vite-ts
        run: npm ci

      - name: 🏗️ Build production bundle
        working-directory: ./vite-ts
        run: npm run build

      - name: 🔑 Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🛡️ Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT || '47822' }} ${{ secrets.SSH_HOST || '169.58.75.192' }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to Remote Server
        env:
          HOST: ${{ secrets.SSH_HOST || '169.58.75.192' }}
          PORT: ${{ secrets.SSH_PORT || '47822' }}
          USER: ${{ secrets.SSH_USER || 'patrice' }}
          TARGET: ${{ secrets.TARGET_DIR || '/opt/applications/portfolio-foka/dist/' }}
        run: |
          echo "Syncing production build to $USER@$HOST:$TARGET..."
          rsync -avz --delete -e "ssh -p $PORT" ./vite-ts/dist/ $USER@$HOST:$TARGET
          ssh -p $PORT $USER@$HOST "chmod -R a+rX $TARGET"

      - name: ✅ Verify Production Healthcheck
        run: |
          echo "Checking https://foka.dogspa-cm.com status..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://foka.dogspa-cm.com)
          echo "HTTP response code: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Healthcheck failed! Expected 200, got $STATUS"
            exit 1
          fi
          echo "Portfolio is LIVE and responding healthy!"
